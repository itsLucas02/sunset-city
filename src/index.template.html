<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset City — top-down joyride</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e13;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(6,8,12,.42) 100%);z-index:2}
  .ov{position:fixed;z-index:5;user-select:none}
  #controls{top:14px;left:14px;background:rgba(8,10,14,.62);border-left:4px solid #ffd23f;border-radius:4px;padding:10px 14px;color:#c8cfd8;font-size:11px;line-height:1.9;letter-spacing:.4px}
  #controls b{color:#fff;font-weight:700}
  #controls .k{display:inline-block;min-width:86px;color:#ffd23f;font-weight:700}
  #speedo{right:18px;bottom:14px;text-align:right;display:none}
  #speedo .spd{font-family:Impact,'Arial Black',sans-serif;font-size:46px;color:#ffd23f;text-shadow:0 3px 0 rgba(0,0,0,.85),0 0 18px rgba(255,180,40,.35);line-height:1}
  #speedo .unit{font-size:12px;color:#e8ecf1;font-weight:700;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.8)}
  #speedo .cname{font-family:Impact,'Arial Black',sans-serif;font-size:15px;color:#fff;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.85)}
  #hint{left:50%;bottom:78px;transform:translateX(-50%);background:rgba(8,10,14,.72);color:#fff;font-weight:700;font-size:12px;letter-spacing:1.5px;padding:8px 16px;border-radius:20px;border:1px solid rgba(255,210,63,.5);display:none}
  #toast{left:50%;top:64px;transform:translateX(-50%);background:rgba(8,10,14,.78);color:#ffd23f;font-family:Impact,'Arial Black',sans-serif;font-size:20px;letter-spacing:3px;padding:10px 26px;border-radius:4px;border-bottom:3px solid #ffd23f;opacity:0;transition:opacity .25s;text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #toast.show{opacity:1}
  #paused{left:50%;top:44%;transform:translate(-50%,-50%);display:none;color:#fff;font-family:Impact,'Arial Black',sans-serif;font-size:52px;letter-spacing:8px;text-shadow:0 4px 0 rgba(0,0,0,.8)}
  #vitals{top:14px;right:16px;text-align:right}
  #stars{font-size:25px;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.85)}
  .star{color:rgba(255,255,255,.13);display:inline-block}
  .star.on{color:#ffd23f;text-shadow:0 0 12px rgba(255,180,40,.75),0 2px 0 rgba(0,0,0,.85)}
  .star.pop{animation:starpop .35s ease}
  @keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
  .bar{width:132px;height:9px;background:rgba(8,10,14,.66);border:1px solid rgba(255,255,255,.28);border-radius:5px;margin:7px 0 0 auto;overflow:hidden}
  #hpfill{height:100%;width:100%;background:#57c15a;border-radius:4px}
  #carbarwrap{display:none}
  #carfill{height:100%;width:100%;background:#4aa3e0;border-radius:4px}
  #minimap{position:fixed;left:16px;bottom:16px;z-index:4;width:172px;height:172px;border-radius:50%;border:3px solid rgba(255,210,63,.8);box-shadow:0 6px 20px rgba(0,0,0,.55);background:#14181d}
  #wasted{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(60,0,0,.38),rgba(12,0,0,.82));color:#d43a2a;font-family:Impact,'Arial Black',sans-serif;font-size:min(16vw,84px);letter-spacing:12px;text-shadow:0 5px 0 rgba(0,0,0,.7)}
  #title{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 38%,rgba(14,20,30,.55),rgba(6,8,12,.88));display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;cursor:pointer}
  #title.hide{opacity:0;pointer-events:none}
  #title h1{font-family:Impact,'Arial Black',sans-serif;font-size:min(11vw,92px);letter-spacing:6px;background:linear-gradient(180deg,#ffe08a 0%,#ffd23f 45%,#ff5a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.55));line-height:1}
  #title .sub{color:#aeb9c6;letter-spacing:6px;font-size:13px;font-weight:700;margin-top:12px}
  #title .press{color:#fff;font-weight:700;letter-spacing:3px;font-size:14px;margin-top:46px;animation:blink 1.1s infinite}
  #title .foot{position:absolute;bottom:18px;color:#5d6774;font-size:11px;letter-spacing:1px}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
  #errbox{position:fixed;top:0;left:0;right:0;z-index:99;display:none;background:#7a1f1a;color:#ffd8d2;font:12px monospace;padding:8px 12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="errbox"></div>
<div id="vignette"></div>
<div id="controls" class="ov">
  <div><span class="k">W A S D</span> <b>move / drive</b></div>
  <div><span class="k">SHIFT</span> <b>sprint</b></div>
  <div><span class="k">E</span> <b>enter / exit car</b></div>
  <div><span class="k">SPACE</span> <b>handbrake</b></div>
  <div><span class="k">H</span> <b>horn</b> &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; <b>P</b> pause</div>
  <div style="margin-top:4px;color:#8b939e">crime brings ★ — outrun the heat</div>
</div>
<div id="hint" class="ov"></div>
<div id="toast" class="ov"></div>
<div id="speedo" class="ov"><div class="spd"><span id="spd">0</span></div><div class="unit">KM/H</div><div class="cname" id="cname"></div></div>
<div id="paused" class="ov">PAUSED</div>
<div id="vitals" class="ov">
  <div id="stars">
    <span class="star" id="star0">★</span><span class="star" id="star1">★</span><span class="star" id="star2">★</span><span class="star" id="star3">★</span><span class="star" id="star4">★</span>
  </div>
  <div class="bar"><div id="hpfill"></div></div>
  <div class="bar" id="carbarwrap"><div id="carfill"></div></div>
</div>
<canvas id="minimap" width="172" height="172"></canvas>
<div id="wasted">WASTED</div>
<div id="title">
  <h1>SUNSET CITY</h1>
  <div class="sub">A TOP-DOWN JOYRIDE</div>
  <div class="press">PRESS ANY KEY</div>
  <div class="foot">steal a ride · dodge the traffic · three.js</div>
</div>
<script>window.onerror=function(m){var e=document.getElementById('errbox');e.style.display='block';e.textContent+='Error: '+m+'\n';};</script>
<script>/*__THREE__*/</script>
<script>/*__GAME__*/</script>
</body>
</html>
